# uvc_config.ini  –  PHD2 UVC / V4L2 camera preset configuration
# =================================================================
#
# Sections are applied in increasing order of specificity, so more
# specific sections override less specific ones:
#
#   [global]              applies to every V4L2 camera
#   [sensor:SensorName]   applies to all cameras using that sensor chip
#   [name:CameraName]     applies to all cameras with that product name
#   [VID:PID]             applies to one specific USB device (hex IDs)
#
# Sensor names and camera names are taken from uvc_cameras.xml.
# VID and PID are the USB vendor and product IDs in lowercase hex,
# e.g. [046d:0825] for the Logitech C270.
#
# Setting any value to "ignore" leaves that option completely
# untouched on the device.
#
# Keys
# ----
#   preferred_formats
#       Comma-separated list of pixel formats to try, in order.
#       PHD2 selects the first one the device accepts.
#       Valid tokens: YUYV  YVYU  UYVY  GREY  Y16  MJPEG
#       Default: YUYV,GREY,Y16,MJPEG
#
#   width / height
#       Requested capture resolution in pixels.  The driver may round
#       these to the nearest supported size.
#       Set to 0 or "ignore" to let the driver choose.
#
#   num_buffers
#       Number of kernel mmap capture buffers (minimum 2).
#       "ignore" resets to the compiled default (4).
#
#   exposure_mode
#       auto    – enable the camera's auto-exposure algorithm
#       manual  – disable auto-exposure so PHD2 sets a fixed duration
#       ignore  – do not change the current exposure mode
#
#   gain
#       Integer 0–100 (maps linearly to the device's gain range).
#       "ignore" – PHD2 manages gain per-frame.
# =================================================================


# ------------------------------------------------------------------
# Global defaults
# ------------------------------------------------------------------
[global]
preferred_formats = YUYV,GREY,Y16,MJPEG
width             = 0
height            = 0
num_buffers       = 4
exposure_mode     = ignore
gain              = ignore


# ------------------------------------------------------------------
# Sensor-level overrides
# These apply to every camera that uses the named sensor chip,
# regardless of which manufacturer built the camera around it.
# ------------------------------------------------------------------

# OmniVision OV9715 – found in several low-cost webcams used for
# guiding (Logitech C270/C310, Microsoft LifeCam Cinema, etc.).
# YUYV at 1280x720 is the most reliable mode on this sensor.
[sensor:OmniVision OV9715]
preferred_formats = YUYV,GREY
width             = 1280
height            = 720
exposure_mode     = ignore

# Aptina AR0130CS – used in ZWO ASI120 series.
# Supports true manual exposure; prefer 8-bit grey to save bandwidth.
[sensor:Aptina AR0130CS]
preferred_formats = GREY,YUYV
width             = 1280
height            = 960
exposure_mode     = manual

# Sony IMX219 – 1/4" BSI sensor found in Raspberry Pi Camera v2
# and some compact guide cameras.
[sensor:Sony IMX219]
preferred_formats = YUYV,GREY
width             = 1920
height            = 1080
exposure_mode     = ignore

# OmniVision OV2710 – Svbony SV105/SV205.
[sensor:OmniVision OV2710]
preferred_formats = YUYV,GREY
width             = 1920
height            = 1080
exposure_mode     = manual


# ------------------------------------------------------------------
# Camera name overrides
# These apply to all USB devices whose product name matches the
# entry in uvc_cameras.xml (case-insensitive).
# ------------------------------------------------------------------

# ZWO ASI120MM Mini – monochrome, use grey format if available.
[name:ZWO ASI120MM Mini]
preferred_formats = GREY,YUYV
exposure_mode     = manual
gain              = ignore

# ZWO ASI120MC – colour variant; same sensor, same exposure support.
[name:ZWO ASI120MC]
preferred_formats = YUYV
exposure_mode     = manual
gain              = ignore

# Logitech C920 – 1080p webcam; MJPEG is more efficient at full res.
[name:Logitech C920]
preferred_formats = YUYV,MJPEG
width             = 1920
height            = 1080


# ------------------------------------------------------------------
# USB VID:PID overrides (most specific – applied last)
# Use these for fine-tuning a single physical device when a sensor
# or name section is not specific enough.
# ------------------------------------------------------------------

# Logitech C270  (046d:0825)
# Override to 1280x720 even though the sensor section sets the same;
# shown here as an example of a VID:PID entry.
[046d:0825]
width  = 1280
height = 720

# Svbony SV105  (0547:2131)
[0547:2131]
exposure_mode = manual

# Svbony SV205  (0547:2132)
[0547:2132]
exposure_mode = manual
